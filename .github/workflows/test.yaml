on:
  pull_request:
    branches: [master]
  push:
    branches: [typed-backend-compat]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_eval
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter_eval
      - uses: actions/checkout@v4
        with:
          repository: ethanblake4/dart_eval
          ref: xv2
          path: dart_eval
      - uses: actions/checkout@v4
        with:
          repository: ethanblake4/control_flow_graph
          path: control_flow_graph
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter_eval/.fvmrc
      - name: Use the xv2 checkout
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            dart_eval:
              path: ../dart_eval
          YAML
      - run: flutter pub get
      - run: dart run tool/generate_bindings.dart --check
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter test --no-pub tool/export_bindings.dart
