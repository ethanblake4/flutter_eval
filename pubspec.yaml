name: flutter_eval
description: Flutter bridge library for dart_eval, enabling creation of fully dynamic Flutter apps and widgets that can be loaded from a file or the Internet at runtime.
version: 0.8.2
homepage: https://github.com/ethanblake4/flutter_eval

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - flutter
  - codepush
  - interpreter
  - dynamic
  - widget

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: ">=3.47.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dart_eval: ^0.8.4
  path_provider: ^2.1.0
  http: ^1.1.0
  vector_math: ^2.4.3

dev_dependencies:
  analyzer: ^13.0.0
  dart_style: ^3.1.0
  pub_semver: ^2.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: '>=6.0.0'
    
flutter:
