plugin:
  out: lib/flutter_eval.dart
  class: FlutterEvalPlugin
  identifier: package:flutter
  imports:
  - src/widgets/framework.dart
  - src/widgets/pages.dart
  - src/typedefs.dart
  - src/foundation/change_notifier.dart
  - src/services/platform_channel.dart
  - src/services/binary_messenger.dart
  excludeDeclarations:
  - StatelessWidget
  - StatefulWidget
  - State
  - ChangeNotifier
  extraDeclarations:
  - $ChangeNotifier$bridge.$declaration
  - $StatelessWidget$bridge.$declaration
  - $StatefulWidget$bridge.$declaration
  - $State$bridge.$declaration
  - $MethodChannel.$declaration
  - $BinaryMessenger.$declaration
  evalSources:
  - uri: package:flutter/src/widgets/scrollable.dart
    file: .dart_eval/sources/scrollable.dart
  - uri: package:flutter/src/widgets/scrollable_helpers.dart
    file: .dart_eval/sources/scrollable_helpers.dart
  - expression: >-
      DartSource(
        sdkTypedefsSource.uri.toString(),
        "import 'package:flutter/widgets.dart';\n${sdkTypedefsSource.stringSource}"
      )
  - uri: dart:ui
    file: .dart_eval/sources/dart_ui.dart
  - uri: package:flutter/animation.dart
    file: .dart_eval/sources/animation.dart
  - uri: package:flutter/src/animation/animation_controller.dart
    file: .dart_eval/sources/animation_controller.dart
  - uri: package:flutter/foundation.dart
    file: .dart_eval/sources/foundation.dart
  - uri: package:flutter/gestures.dart
    file: .dart_eval/sources/gestures.dart
  - uri: package:flutter/src/widgets/gesture_detector.dart
    file: .dart_eval/sources/gesture_detector.dart
  - uri: package:flutter/material.dart
    file: .dart_eval/sources/material.dart
  - uri: package:flutter/painting.dart
    file: .dart_eval/sources/painting.dart
  - uri: package:flutter/src/painting/basic_types.dart
    file: .dart_eval/sources/painting_basic_types.dart
  - uri: package:flutter/rendering.dart
    file: .dart_eval/sources/rendering.dart
  - uri: package:flutter/src/rendering/object.dart
    file: .dart_eval/sources/rendering_object.dart
  - uri: package:flutter/scheduler.dart
    file: .dart_eval/sources/scheduler.dart
  - uri: package:flutter/services.dart
    file: .dart_eval/sources/services.dart
  - uri: package:flutter/widgets.dart
    file: .dart_eval/sources/widgets.dart
  - uri: package:flutter/src/widgets/framework.dart
    file: .dart_eval/sources/widgets_framework.dart
  - uri: package:flutter/src/widgets/basic.dart
    file: .dart_eval/sources/widgets_basic.dart
  - uri: package:flutter/cupertino.dart
    file: .dart_eval/sources/cupertino.dart
  extraSources:
  - expression: registry.addExportedLibraryMapping('package:flutter/src/animation', 'package:flutter_eval/animation.dart')
  - expression: registry.addExportedLibraryMapping('package:flutter/src/foundation', 'package:flutter_eval/foundation.dart')
  - expression: registry.addExportedLibraryMapping('package:flutter/src/gestures', 'package:flutter_eval/gestures.dart')
  - expression: registry.addExportedLibraryMapping('package:flutter/src/material', 'package:flutter_eval/material.dart')
  - expression: registry.addExportedLibraryMapping('package:flutter/src/painting', 'package:flutter_eval/painting.dart')
  - expression: registry.addExportedLibraryMapping('package:flutter/src/rendering', 'package:flutter_eval/rendering.dart')
  - expression: registry.addExportedLibraryMapping('package:flutter/src/scheduler', 'package:flutter_eval/scheduler.dart')
  - expression: registry.addExportedLibraryMapping('package:flutter/src/services', 'package:flutter_eval/services.dart')
  - expression: registry.addExportedLibraryMapping('package:flutter/src/widgets', 'package:flutter_eval/widgets.dart')
  - expression: registry.addExportedLibraryMapping('dart:ui', 'package:flutter_eval/ui.dart')
  - target: runtime
    expression: 'runtime.registerBridgeFuncRegisters(''package:flutter/src/foundation/change_notifier.dart'',
      ''ChangeNotifier.'', $ChangeNotifier$bridge.$new, isBridge: true)'
  - target: runtime
    expression: 'runtime.registerBridgeFuncRegisters(''package:flutter/src/widgets/framework.dart'', ''StatelessWidget.'',
      $StatelessWidget$bridge.$new, isBridge: true)'
  - target: runtime
    expression: 'runtime.registerBridgeFuncRegisters(''package:flutter/src/widgets/framework.dart'', ''StatefulWidget.'',
